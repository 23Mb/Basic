name: Update Porno.list

on:
  schedule:
    - cron: '0 4 * * *'  # daily at 04:00 UTC
  workflow_dispatch:      # manual trigger

permissions:
  contents: write  # needed to push commits

jobs:
  update-porno-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch MetaCubeX sources and convert to Shadowrocket format
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-porn.list -o porn.raw
          curl -fsSL https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bongacams.yaml -o bc.yaml
          if ! grep -q '^+\.' porn.raw; then
            echo "❌ Failed to fetch category-porn list"
            exit 1
          fi
          python3 - <<'PYEOF'
          lines = set()
          for l in open('porn.raw'):
              d = l.strip().lstrip('+.').strip()
              if d and not d.startswith('#'):
                  lines.add('DOMAIN-SUFFIX,' + d)
          for l in open('bc.yaml'):
              d = l.strip().lstrip('-').strip().lstrip('+.').strip()
              if d and not d.startswith('#') and d != 'payload:':
                  lines.add('DOMAIN-SUFFIX,' + d)
          lines.add('DOMAIN-KEYWORD,bongacams')
          header = (
              '# Porno.list: auto-updated from MetaCubeX category-porn + bongacams\n'
              '# Shadowrocket rules, PROXY\n'
          )
          open('Porno.list.new', 'w').write(header + '\n'.join(sorted(lines)) + '\n')
          print(f'Domains: {len(lines)}')
          PYEOF

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet Porno.list; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat Porno.list
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Porno.list
          git commit -m "chore: update Porno.list from MetaCubeX [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git push
          echo "✅ Pushed updated Porno.list"
